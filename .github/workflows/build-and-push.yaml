name: DevSecOps CI Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-push:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------------------
      # Checkout Repository
      # ----------------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ----------------------------------------------------
      # SECURITY GATE 0 - SAST
      # ----------------------------------------------------
      - name: Run Semgrep SAST
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/javascript
            p/security-audit

      # ----------------------------------------------------
      # SECURITY GATE 1 - Repository Scan
      # ----------------------------------------------------
      - name: Run Trivy FS Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: HIGH,CRITICAL
          exit-code: 1
          ignore-unfixed: true

      # ----------------------------------------------------
      # Build Temporary Image
      # ----------------------------------------------------
      - name: Build Local Image for Scanning
        run: |
          docker build \
            -t temp-scan-image:latest \
            ./app

      # ----------------------------------------------------
      # SECURITY GATE 2 - Image Scan
      # ----------------------------------------------------
      - name: Run Trivy Image Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: temp-scan-image:latest
          format: table
          exit-code: 1
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      # ----------------------------------------------------
      # SECURITY GATE 3 - DAST
      # ----------------------------------------------------
      - name: Start Application for DAST
        run: |
          docker run -d \
            --name dast-target \
            -p 8080:80 \
            temp-scan-image:latest

      # ----------------------------------------------------
      # Wait for Application
      # ----------------------------------------------------
      - name: Wait for Application
        run: |
          echo "Waiting for application..."

          for i in {1..30}; do
            if curl -fs http://localhost:8080; then
              echo ""
              echo "Application is ready."
              exit 0
            fi

            echo "Waiting... ($i/30)"
            sleep 2
          done

          echo "Application failed to start."

          docker logs dast-target

          exit 1

      # ----------------------------------------------------
      # OWASP ZAP Baseline DAST Scan
      # ----------------------------------------------------
      - name: Run OWASP ZAP DAST
        run: |
          docker run --rm \
            --network host \
            -v "${{ github.workspace }}:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://localhost:8080 \
            -r zap-report.html \
            -J zap-report.json \
            -w zap-report.md

      # ----------------------------------------------------
      # Upload ZAP Reports
      # ----------------------------------------------------
      - name: Upload ZAP Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-dast-report-v${{ github.run_number }}
          path: |
            zap-report.html
            zap-report.json
            zap-report.md

      # ----------------------------------------------------
      # Stop DAST Target
      # ----------------------------------------------------
      - name: Stop DAST Application
        if: always()
        run: |
          docker stop dast-target || true
          docker rm dast-target || true

      # ----------------------------------------------------
      # Generate Software Bill of Materials (SBOM)
      # ----------------------------------------------------
      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Generate SBOM
        run: |
          syft temp-scan-image:latest \
            -o cyclonedx-json \
            > sbom-v${{ github.run_number }}.json

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-v${{ github.run_number }}
          path: sbom-v${{ github.run_number }}.json

      # ----------------------------------------------------
      # Setup Multi-Architecture Build
      # ----------------------------------------------------
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ----------------------------------------------------
      # Docker Login
      # ----------------------------------------------------
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ----------------------------------------------------
      # Build & Push Docker Image
      # ----------------------------------------------------
      - name: Build and Push Docker Image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./app
          file: ./app/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            a05shwin11/devsecops_html:v${{ github.run_number }}

      # ----------------------------------------------------
      # Install Cosign
      # ----------------------------------------------------
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      # ----------------------------------------------------
      # Recreate Cosign Keys
      # ----------------------------------------------------
      - name: Create Cosign Private Key
        run: |
          echo "${{ secrets.COSIGN_PRIVATE_KEY }}" > cosign.key

      - name: Create Cosign Public Key
        run: |
          echo "${{ secrets.COSIGN_PUBLIC_KEY }}" > cosign.pub

      # ----------------------------------------------------
      # Sign Docker Image
      # ----------------------------------------------------
      - name: Sign Docker Image
        env:
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          cosign sign \
            --key cosign.key \
            --yes \
            a05shwin11/devsecops_html@${{ steps.build.outputs.digest }}

      # ----------------------------------------------------
      # Verify Signature
      # ----------------------------------------------------
      - name: Verify Image Signature
        run: |
          cosign verify \
            --key cosign.pub \
            a05shwin11/devsecops_html@${{ steps.build.outputs.digest }}

      # ----------------------------------------------------
      # Update Kubernetes Manifest
      # ----------------------------------------------------
      - name: Update Deployment Image Tag
        run: |
          sed -i "s|image: .*|image: a05shwin11/devsecops_html:v${{ github.run_number }}|g" kubernetes/deployment.yaml

      # ----------------------------------------------------
      # Commit Updated Manifest
      # ----------------------------------------------------
      - name: Commit Deployment Manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add kubernetes/deployment.yaml

          if git diff --cached --quiet; then
            echo "No deployment changes detected."
          else
            git commit -m "ci: update image to v${{ github.run_number }}"
          fi

      # ----------------------------------------------------
      # Push Changes Back to GitHub
      # ----------------------------------------------------
      - name: Push Changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: main