name: DevSecOps CI Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:

  build-and-push:

    if: github.actor != 'github-actions[bot]'

    runs-on: ubuntu-latest

    steps:

      # ====================================================
      # CHECKOUT REPOSITORY
      # ====================================================

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ====================================================
      # SECURITY GATE 0 - SAST
      # SEMGREP
      # ====================================================

      - name: Run Semgrep SAST
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/javascript
            p/security-audit


      # ====================================================
      # SECURITY GATE 1 - FILESYSTEM SCAN
      # TRIVY
      # ====================================================

      - name: Run Trivy FS Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: HIGH,CRITICAL


      # ====================================================
      # BUILD TEMPORARY IMAGE
      # ====================================================

      - name: Build Local Image for Scanning
        run: |

          docker build \
            -t temp-scan-image:latest \
            ./app


      # ====================================================
      # SECURITY GATE 2 - CONTAINER IMAGE SCAN
      # TRIVY
      # ====================================================

      - name: Run Trivy Image Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: temp-scan-image:latest
          format: table
          exit-code: 1
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL


      # ====================================================
      # START APPLICATION FOR DAST
      # ====================================================

      - name: Start Application for DAST
        run: |

          docker run -d \
            --name dast-target \
            -p 8080:80 \
            temp-scan-image:latest

          echo "Application container started."


      # ====================================================
      # WAIT FOR APPLICATION
      # ====================================================

      - name: Wait for Application
        run: |

          echo "Waiting for application..."

          for i in {1..30}; do

            if curl -fs http://localhost:8080; then

              echo ""
              echo "Application is ready."

              exit 0

            fi

            echo "Waiting... ($i/30)"

            sleep 2

          done

          echo "Application failed to start."

          echo "========================================"
          echo "APPLICATION LOGS"
          echo "========================================"

          docker logs dast-target

          exit 1


      # ====================================================
      # OWASP ZAP DAST
      # ====================================================

      - name: Run OWASP ZAP DAST
        continue-on-error: true
        run: |

          echo "========================================"
          echo "Preparing OWASP ZAP"
          echo "========================================"

          mkdir -p zap-reports

          chmod 777 zap-reports

          echo "Running ZAP baseline scan..."

          docker run --rm \
            --network host \
            -v "${{ github.workspace }}/zap-reports:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://localhost:8080 \
            -r zap-report.html \
            -J zap-report.json \
            -w zap-report.md

          echo "ZAP scan completed."


      # ====================================================
      # UPLOAD ZAP REPORTS
      # ====================================================

      - name: Upload ZAP Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-dast-report-v${{ github.run_number }}
          path: zap-reports/
          if-no-files-found: warn


      # ====================================================
      # DISPLAY ZAP SUMMARY
      # ====================================================

      - name: Display ZAP Summary
        if: always()
        run: |

          echo "========================================"
          echo "OWASP ZAP DAST SUMMARY"
          echo "========================================"

          if [ -f zap-reports/zap-report.md ]; then

            cat zap-reports/zap-report.md

          else

            echo "ZAP report was not generated."

          fi


      # ====================================================
      # STOP DAST APPLICATION
      # ====================================================

      - name: Stop DAST Application
        if: always()
        run: |

          docker stop dast-target || true

          docker rm dast-target || true


      # ====================================================
      # SBOM
      # SYFT
      # ====================================================

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0


      - name: Generate SBOM
        run: |

          syft temp-scan-image:latest \
            -o cyclonedx-json \
            > sbom-v${{ github.run_number }}.json


      # ====================================================
      # UPLOAD SBOM
      # ====================================================

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-v${{ github.run_number }}
          path: sbom-v${{ github.run_number }}.json


      # ====================================================
      # SETUP QEMU
      # ====================================================

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3


      # ====================================================
      # SETUP DOCKER BUILDX
      # ====================================================

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      # ====================================================
      # DOCKER HUB LOGIN
      # ====================================================

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}


      # ====================================================
      # BUILD AND PUSH PRODUCTION IMAGE
      # ====================================================

      - name: Build and Push Docker Image
        id: build
        uses: docker/build-push-action@v5
        with:

          context: ./app

          file: ./app/Dockerfile

          push: true

          platforms: |
            linux/amd64
            linux/arm64

          tags: |
            a05shwin11/devsecops_html:v${{ github.run_number }}


      # ====================================================
      # INSTALL COSIGN
      # ====================================================

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3


      # ====================================================
      # CREATE COSIGN PRIVATE KEY
      # ====================================================

      - name: Create Cosign Private Key
        run: |

          echo "${{ secrets.COSIGN_PRIVATE_KEY }}" > cosign.key


      # ====================================================
      # CREATE COSIGN PUBLIC KEY
      # ====================================================

      - name: Create Cosign Public Key
        run: |

          echo "${{ secrets.COSIGN_PUBLIC_KEY }}" > cosign.pub


      # ====================================================
      # SIGN DOCKER IMAGE
      # ====================================================

      - name: Sign Docker Image
        env:

          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}

        run: |

          cosign sign \
            --key cosign.key \
            --yes \
            a05shwin11/devsecops_html@${{ steps.build.outputs.digest }}


      # ====================================================
      # VERIFY DOCKER IMAGE SIGNATURE
      # ====================================================

      - name: Verify Image Signature
        run: |

          cosign verify \
            --key cosign.pub \
            a05shwin11/devsecops_html@${{ steps.build.outputs.digest }}


      # ====================================================
      # UPDATE KUBERNETES MANIFEST
      # ====================================================

      - name: Update Deployment Image Tag
        run: |

          sed -i \
            "s|image: .*|image: a05shwin11/devsecops_html:v${{ github.run_number }}|g" \
            kubernetes/deployment.yaml


      # ====================================================
      # COMMIT KUBERNETES MANIFEST
      # ====================================================

      - name: Commit Deployment Manifest
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add kubernetes/deployment.yaml

          if git diff --cached --quiet; then

            echo "No deployment changes detected."

          else

            git commit \
              -m "ci: update image to v${{ github.run_number }}"

          fi


      # ====================================================
      # PUSH MANIFEST TO GITHUB
      # ====================================================

      - name: Push Changes
        uses: ad-m/github-push-action@master
        with:

          github_token: ${{ secrets.GITHUB_TOKEN }}

          branch: main